[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000
seed = "0x2026"

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[lint]
exclude_lints = ["block-timestamp", "unsafe-typecast", "missing-events-access-control"]
