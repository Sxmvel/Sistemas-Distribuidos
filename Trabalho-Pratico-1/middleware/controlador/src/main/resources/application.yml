spring:
  application:
    name: controlador
  main:
    banner-mode: off
    keep-alive: true
  datasource:
    url: jdbc:h2:file:./dados/c${controlador.id}/barragem;WRITE_DELAY=0
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 3

mqtt:
  url: tcp://localhost:1883

controlador:
  id: 1
  timeout-ping-ms: 400
  intervalo-heartbeat-ms: 1000
  quorum-replicacao: 2
  persistencia-leituras: 3
  histerese-descida-ms: 15000
  janela-tempo-ms: 10000
  limite-quarentena: 9
  teto-suspeita: 15
  rejeicoes-para-recalibrar: 5
  cluster:
    - id: 1
      host: localhost
      porta: 50051
    - id: 2
      host: localhost
      porta: 50052
    - id: 3
      host: localhost
      porta: 50053

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [c${controlador.id}] %msg%n"
  level:
    root: warn
    br.sd.barragem: info
